name: fresh_veg
description: A fresh vegetable shopping app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase - Updated compatible versions
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # State Management
  provider: ^6.1.1
  
  # Utilities
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

# Fix web compilation issues
dependency_overrides:
  web: ^0.5.1
  firebase_core_web: ^2.11.5
  firebase_auth_web: ^5.9.8
  cloud_firestore_web: ^3.10.8

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  # Fonts
  fonts:
    - family: HennyPenny
      fonts:
        - asset: assets/fonts/Henny_Penny/HennyPenny-Regular.ttf